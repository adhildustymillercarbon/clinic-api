services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_secret}
      POSTGRES_DB: ${POSTGRES_DB:-clinic_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinic} -d ${POSTGRES_DB:-clinic_booking}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clinic_booking_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: clinic_booking_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://clinic:clinic_secret@postgres:5432/clinic_booking
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-secret-api-key}
      OPENOBSERVE_AI_TOKEN: ${OPENOBSERVE_AI_TOKEN:-}
      OPENOBSERVE_ENDPOINT: ${OPENOBSERVE_ENDPOINT:-https://api.openobserve.ai}
      OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
      OPENOBSERVE_STREAM: ${OPENOBSERVE_STREAM:-default}
      OPENOBSERVE_SERVICE_NAME: ${OPENOBSERVE_SERVICE_NAME:-clinic-booking}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_KEY: ${VITE_API_KEY:-${API_KEY:-secret-api-key}}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    container_name: clinic_booking_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - app

  test:
    build: .
    container_name: clinic_booking_test
    volumes:
      - .:/app
    environment:
      API_KEY: ${API_KEY:-secret-api-key}
    command: ["pytest", "-v"]

volumes:
  postgres_data:
  redis_data:
